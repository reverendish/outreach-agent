AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        BEDROCK_REGION: eu-west-2
        ALLOWED_ORIGIN: https://outreach.ishsitotombe.co.uk
        PROSPECTS_TABLE:
          Ref: ProspectsTable
  HttpApi:
    DefaultRouteSettings:
      ThrottlingBurstLimit: 20
      ThrottlingRateLimit: 5
Resources:
  ProspectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-prospects
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: companyNumber
        AttributeType: S
      - AttributeName: status
        AttributeType: S
      - AttributeName: contactedAt
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      - AttributeName: companyNumber
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: ByStatus
        KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: status
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: ByContactedAt
        KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: contactedAt
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  CRMFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CRMFunction
      Handler: crm.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProspectsTable
      Environment:
        Variables:
          OUTREACH_API_KEY:
            Fn::Sub: '{{resolve:ssm:/outreach/api_key}}'
      Events:
        CRMGet:
          Type: HttpApi
          Properties:
            Path: /api/crm
            Method: GET
        CRMPost:
          Type: HttpApi
          Properties:
            Path: /api/crm
            Method: POST
        CRMPatch:
          Type: HttpApi
          Properties:
            Path: /api/crm/{companyNumber}
            Method: PATCH
        CRMDelete:
          Type: HttpApi
          Properties:
            Path: /api/crm/{companyNumber}
            Method: DELETE
        CRMOptions:
          Type: HttpApi
          Properties:
            Path: /api/crm
            Method: OPTIONS
        CRMOptions2:
          Type: HttpApi
          Properties:
            Path: /api/crm/{companyNumber}
            Method: OPTIONS
    Metadata:
      SamResourceId: CRMFunction
  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SearchFunction
      Handler: search.handler
      Environment:
        Variables:
          COMPANIES_HOUSE_API_KEY:
            Fn::Sub: '{{resolve:ssm:/outreach/companies_house_api_key}}'
      Events:
        SearchPost:
          Type: HttpApi
          Properties:
            Path: /search
            Method: POST
        SearchGet:
          Type: HttpApi
          Properties:
            Path: /search
            Method: GET
        SearchOptions:
          Type: HttpApi
          Properties:
            Path: /search
            Method: OPTIONS
    Metadata:
      SamResourceId: SearchFunction
  OfficersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: OfficersFunction
      Handler: officers.handler
      Environment:
        Variables:
          COMPANIES_HOUSE_API_KEY:
            Fn::Sub: '{{resolve:ssm:/outreach/companies_house_api_key}}'
      Events:
        OfficersPost:
          Type: HttpApi
          Properties:
            Path: /officers
            Method: POST
        OfficersGet:
          Type: HttpApi
          Properties:
            Path: /officers
            Method: GET
        OfficersOptions:
          Type: HttpApi
          Properties:
            Path: /officers
            Method: OPTIONS
    Metadata:
      SamResourceId: OfficersFunction
  GenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GenerateFunction
      Handler: generate.handler
      MemorySize: 512
      Timeout: 60
      Policies:
      - AmazonBedrockFullAccess
      Events:
        GeneratePost:
          Type: HttpApi
          Properties:
            Path: /generate
            Method: POST
        GenerateOptions:
          Type: HttpApi
          Properties:
            Path: /generate
            Method: OPTIONS
    Metadata:
      SamResourceId: GenerateFunction
  CHLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CHLookupFunction
      Handler: ch-lookup.handler
      Environment:
        Variables:
          COMPANIES_HOUSE_API_KEY:
            Fn::Sub: '{{resolve:ssm:/outreach/companies_house_api_key}}'
      Events:
        CHLookupPost:
          Type: HttpApi
          Properties:
            Path: /ch-lookup
            Method: POST
        CHLookupOptions:
          Type: HttpApi
          Properties:
            Path: /ch-lookup
            Method: OPTIONS
    Metadata:
      SamResourceId: CHLookupFunction
  WebEnrichmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: WebEnrichmentFunction
      Handler: web-enrichment.handler
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          BRAVE_API_KEY:
            Fn::Sub: '{{resolve:ssm:/outreach/brave_api_key}}'
      Events:
        WebEnrichPost:
          Type: HttpApi
          Properties:
            Path: /web-enrichment
            Method: POST
        WebEnrichOptions:
          Type: HttpApi
          Properties:
            Path: /web-enrichment
            Method: OPTIONS
    Metadata:
      SamResourceId: WebEnrichmentFunction
  EnrichmentSynthesisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: EnrichmentSynthesisFunction
      Handler: enrichment-synthesis.handler
      MemorySize: 512
      Timeout: 60
      Policies:
      - AmazonBedrockFullAccess
      Events:
        EnrichSynthPost:
          Type: HttpApi
          Properties:
            Path: /enrichment-synthesis
            Method: POST
        EnrichSynthOptions:
          Type: HttpApi
          Properties:
            Path: /enrichment-synthesis
            Method: OPTIONS
    Metadata:
      SamResourceId: EnrichmentSynthesisFunction
  EnrichFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: EnrichFunction
      Handler: enrich.handler
      MemorySize: 256
      Timeout: 90
      Policies:
      - AmazonBedrockFullAccess
      - Statement:
        - Effect: Allow
          Action:
          - lambda:InvokeFunction
          Resource: '*'
      Environment:
        Variables:
          COMPANIES_HOUSE_API_KEY:
            Fn::Sub: '{{resolve:ssm:/outreach/companies_house_api_key}}'
          BRAVE_API_KEY:
            Fn::Sub: '{{resolve:ssm:/outreach/brave_api_key}}'
      Events:
        EnrichPost:
          Type: HttpApi
          Properties:
            Path: /enrich
            Method: POST
        EnrichOptions:
          Type: HttpApi
          Properties:
            Path: /enrich
            Method: OPTIONS
    Metadata:
      SamResourceId: EnrichFunction
  SendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SendFunction
      Handler: send.handler
      MemorySize: 256
      Timeout: 30
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProspectsTable
      Environment:
        Variables:
          RESEND_API_KEY:
            Fn::Sub: '{{resolve:ssm:/outreach/resend_api_key}}'
          OUTREACH_API_KEY:
            Fn::Sub: '{{resolve:ssm:/outreach/api_key}}'
      Events:
        SendPost:
          Type: HttpApi
          Properties:
            Path: /send
            Method: POST
        SendOptions:
          Type: HttpApi
          Properties:
            Path: /send
            Method: OPTIONS
    Metadata:
      SamResourceId: SendFunction
  DemoSendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DemoSendFunction
      Handler: demo-send.handler
      MemorySize: 512
      Timeout: 60
      Policies:
      - AmazonBedrockFullAccess
      Environment:
        Variables:
          RESEND_API_KEY:
            Fn::Sub: '{{resolve:ssm:/outreach/resend_api_key}}'
          ALLOWED_ORIGIN: https://ishsitotombe.co.uk
      Events:
        DemoSendPost:
          Type: HttpApi
          Properties:
            Path: /demo-send
            Method: POST
        DemoSendOptions:
          Type: HttpApi
          Properties:
            Path: /demo-send
            Method: OPTIONS
    Metadata:
      SamResourceId: DemoSendFunction
Outputs:
  OutreachApiUrl:
    Description: API Gateway base URL
    Value:
      Fn::Sub: https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ProspectsTableName:
    Description: DynamoDB table name for prospects CRM
    Value:
      Ref: ProspectsTable
