AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        BEDROCK_REGION: eu-west-2
        INTERNAL_API_KEY: !Sub '{{resolve:ssm:/outreach/internal_api_key}}'
        CONTACTS_TABLE: !Ref ContactsTable
        ACCOUNTS_TABLE: !Ref AccountsTable
        DRAFTS_TABLE: !Ref DraftsTable
        SUPPRESSION_TABLE: !Ref SuppressionTable
  HttpApi:
    DefaultRouteSettings:
      ThrottlingBurstLimit: 20
      ThrottlingRateLimit: 5

Resources:

  # ── DynamoDB: contacts (multi-tenant, replaces ProspectsTable) ─────────────
  ContactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-contacts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: contactId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByStatus
          KeySchema:
            - AttributeName: accountId
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByContact
          KeySchema:
            - AttributeName: accountId
              KeyType: HASH
            - AttributeName: contactId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── DynamoDB: users (email/password auth) ─────────────────────────────────
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  # ── DynamoDB: accounts (per-user settings) ─────────────────────────────────
  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-accounts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── DynamoDB: email drafts ─────────────────────────────────────────────────
  DraftsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-drafts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: contactId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByContact
          KeySchema:
            - AttributeName: accountId
              KeyType: HASH
            - AttributeName: contactId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── DynamoDB: suppression list ─────────────────────────────────────────────
  SuppressionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-suppression'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
        - AttributeName: email
          KeyType: RANGE

  # ── CRM: contact CRUD ──────────────────────────────────────────────────────
  CRMFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: crm.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - 'https://outreach.ishsitotombe.co.uk'
            - 'http://localhost:3002'
          AllowMethods:
            - GET
            - POST
            - PATCH
            - DELETE
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - X-Internal-Key
            - X-User-Id

  # ── Account: user settings ─────────────────────────────────────────────────
  AccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: account.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - 'https://outreach.ishsitotombe.co.uk'
            - 'http://localhost:3002'
          AllowMethods:
            - GET
            - PATCH
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - X-Internal-Key
            - X-User-Id
            - X-User-Email
            - X-User-Name

  # ── Drafts: email draft CRUD ───────────────────────────────────────────────
  DraftsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: drafts.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DraftsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - 'https://outreach.ishsitotombe.co.uk'
            - 'http://localhost:3002'
          AllowMethods:
            - GET
            - POST
            - PATCH
            - DELETE
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - X-Internal-Key
            - X-User-Id

  # ── Suppression: opt-out list ─────────────────────────────────────────────
  SuppressionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: suppression.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SuppressionTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - 'https://outreach.ishsitotombe.co.uk'
            - 'http://localhost:3002'
          AllowMethods:
            - GET
            - POST
            - DELETE
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - X-Internal-Key
            - X-User-Id

  # ── Search: Companies House ────────────────────────────────────────────────
  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: search.handler
      Environment:
        Variables:
          COMPANIES_HOUSE_API_KEY: !Sub '{{resolve:ssm:/outreach/companies_house_api_key}}'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - 'https://outreach.ishsitotombe.co.uk'
            - 'http://localhost:3002'
          AllowMethods:
            - POST
            - GET
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - X-Internal-Key
            - X-User-Id

  # ── Enrich: company enrichment orchestrator ────────────────────────────────
  EnrichFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: enrich.handler
      MemorySize: 256
      Timeout: 90
      Policies:
        - AmazonBedrockFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: '*'
      Environment:
        Variables:
          COMPANIES_HOUSE_API_KEY: !Sub '{{resolve:ssm:/outreach/companies_house_api_key}}'
          BRAVE_API_KEY: !Sub '{{resolve:ssm:/outreach/brave_api_key}}'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - 'https://outreach.ishsitotombe.co.uk'
            - 'http://localhost:3002'
          AllowMethods:
            - POST
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - X-Internal-Key
            - X-User-Id

  # ── Generate: Bedrock email writer ────────────────────────────────────────
  GenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: generate.handler
      MemorySize: 512
      Timeout: 60
      Policies:
        - AmazonBedrockFullAccess
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - 'https://outreach.ishsitotombe.co.uk'
            - 'http://localhost:3002'
          AllowMethods:
            - POST
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - X-Internal-Key
            - X-User-Id

  # ── Send: provider-agnostic email send ────────────────────────────────────
  SendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: send.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DraftsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SuppressionTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
                - sesv2:SendEmail
              Resource: '*'
      Environment:
        Variables:
          RESEND_API_KEY: !Sub '{{resolve:ssm:/outreach/resend_api_key}}'
          SES_FROM_EMAIL: !Sub '{{resolve:ssm:/outreach/ses_from_email}}'
          FROM_NAME: 'Ish Sitotombe'
          SES_REGION: eu-west-1
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - 'https://outreach.ishsitotombe.co.uk'
            - 'http://localhost:3002'
          AllowMethods:
            - POST
            - OPTIONS
          AllowHeaders:
            - Content-Type
            - X-Internal-Key
            - X-User-Id

  # ── Portfolio demo: generate + send via Resend (DO NOT MODIFY) ────────────
  DemoSendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: demo-send.handler
      MemorySize: 512
      Timeout: 60
      Policies:
        - AmazonBedrockFullAccess
      Environment:
        Variables:
          RESEND_API_KEY: !Sub '{{resolve:ssm:/outreach/resend_api_key}}'
          ALLOWED_ORIGIN: 'https://ishsitotombe.co.uk'
      Events:
        DemoSendPost:
          Type: HttpApi
          Properties:
            Path: /demo-send
            Method: POST
        DemoSendOptions:
          Type: HttpApi
          Properties:
            Path: /demo-send
            Method: OPTIONS

Outputs:
  ContactsTableName:
    Description: 'DynamoDB contacts table'
    Value: !Ref ContactsTable
  AccountsTableName:
    Description: 'DynamoDB accounts table'
    Value: !Ref AccountsTable
  DraftsTableName:
    Description: 'DynamoDB drafts table'
    Value: !Ref DraftsTable
  SuppressionTableName:
    Description: 'DynamoDB suppression table'
    Value: !Ref SuppressionTable
  DemoApiUrl:
    Description: 'API Gateway URL (demo-send only)'
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
