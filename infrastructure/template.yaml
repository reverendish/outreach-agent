AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  CompaniesHouseApiKey:
    Type: String
    NoEcho: true
    Description: Companies House API key

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        BEDROCK_REGION: eu-west-2
        ALLOWED_ORIGIN: 'https://outreach.ishsitotombe.co.uk'
        COMPANIES_HOUSE_API_KEY: !Ref CompaniesHouseApiKey

Resources:
  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: search.handler
      Events:
        SearchGet:
          Type: HttpApi
          Properties:
            Path: /search
            Method: GET
        SearchOptions:
          Type: HttpApi
          Properties:
            Path: /search
            Method: OPTIONS

  OfficersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: officers.handler
      Events:
        OfficersGet:
          Type: HttpApi
          Properties:
            Path: /officers
            Method: GET
        OfficersOptions:
          Type: HttpApi
          Properties:
            Path: /officers
            Method: OPTIONS

  GenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: generate.handler
      Policies:
        - AmazonBedrockFullAccess
      Events:
        GeneratePost:
          Type: HttpApi
          Properties:
            Path: /generate
            Method: POST
        GenerateOptions:
          Type: HttpApi
          Properties:
            Path: /generate
            Method: OPTIONS

Outputs:
  OutreachApiUrl:
    Description: 'API Gateway base URL'
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
