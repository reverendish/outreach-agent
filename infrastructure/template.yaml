AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        BEDROCK_REGION: eu-west-2
        ALLOWED_ORIGIN: 'https://outreach.ishsitotombe.co.uk'
        PROSPECTS_TABLE: !Ref ProspectsTable
  HttpApi:
    # Rate limiting — protects against abuse and runaway Bedrock costs.
    # 5 req/s sustained, burst to 20. Redeploy with sam build && sam deploy to apply.
    DefaultRouteSettings:
      ThrottlingBurstLimit: 20
      ThrottlingRateLimit: 5

Resources:

  # ── DynamoDB: prospect CRM ─────────────────────────────────────────────────
  ProspectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-prospects'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: companyNumber
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: contactedAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: companyNumber
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByStatus
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByContactedAt
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: contactedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── CRM CRUD Lambda ────────────────────────────────────────────────────────
  CRMFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: crm.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProspectsTable
      Environment:
        Variables:
          OUTREACH_API_KEY: !Sub '{{resolve:ssm:/outreach/api_key}}'
      Events:
        CRMGet:
          Type: HttpApi
          Properties:
            Path: /api/crm
            Method: GET
        CRMPost:
          Type: HttpApi
          Properties:
            Path: /api/crm
            Method: POST
        CRMPatch:
          Type: HttpApi
          Properties:
            Path: /api/crm/{companyNumber}
            Method: PATCH
        CRMDelete:
          Type: HttpApi
          Properties:
            Path: /api/crm/{companyNumber}
            Method: DELETE
        CRMOptions:
          Type: HttpApi
          Properties:
            Path: /api/crm
            Method: OPTIONS
        CRMOptions2:
          Type: HttpApi
          Properties:
            Path: /api/crm/{companyNumber}
            Method: OPTIONS

  # ── Legacy: CH search (used by contacts page) ─────────────────────────────
  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: search.handler
      Environment:
        Variables:
          COMPANIES_HOUSE_API_KEY: !Sub '{{resolve:ssm:/outreach/companies_house_api_key}}'
      Events:
        SearchPost:
          Type: HttpApi
          Properties:
            Path: /search
            Method: POST
        SearchGet:
          Type: HttpApi
          Properties:
            Path: /search
            Method: GET
        SearchOptions:
          Type: HttpApi
          Properties:
            Path: /search
            Method: OPTIONS

  # ── Legacy: CH officers (used when adding a contact) ─────────────────────
  OfficersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: officers.handler
      Environment:
        Variables:
          COMPANIES_HOUSE_API_KEY: !Sub '{{resolve:ssm:/outreach/companies_house_api_key}}'
      Events:
        OfficersPost:
          Type: HttpApi
          Properties:
            Path: /officers
            Method: POST
        OfficersGet:
          Type: HttpApi
          Properties:
            Path: /officers
            Method: GET
        OfficersOptions:
          Type: HttpApi
          Properties:
            Path: /officers
            Method: OPTIONS

  # ── Email generation (Claude Sonnet via Bedrock) ──────────────────────────
  GenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: generate.handler
      MemorySize: 512
      Timeout: 60
      Policies:
        - AmazonBedrockFullAccess
      Events:
        GeneratePost:
          Type: HttpApi
          Properties:
            Path: /generate
            Method: POST
        GenerateOptions:
          Type: HttpApi
          Properties:
            Path: /generate
            Method: OPTIONS

  # ── Full CH lookup (company + officers + filings) ─────────────────────────
  CHLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: ch-lookup.handler
      Environment:
        Variables:
          COMPANIES_HOUSE_API_KEY: !Sub '{{resolve:ssm:/outreach/companies_house_api_key}}'
      Events:
        CHLookupPost:
          Type: HttpApi
          Properties:
            Path: /ch-lookup
            Method: POST
        CHLookupOptions:
          Type: HttpApi
          Properties:
            Path: /ch-lookup
            Method: OPTIONS

  # ── Web enrichment (website + Brave searches) ─────────────────────────────
  WebEnrichmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: web-enrichment.handler
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          BRAVE_API_KEY: !Sub '{{resolve:ssm:/outreach/brave_api_key}}'
      Events:
        WebEnrichPost:
          Type: HttpApi
          Properties:
            Path: /web-enrichment
            Method: POST
        WebEnrichOptions:
          Type: HttpApi
          Properties:
            Path: /web-enrichment
            Method: OPTIONS

  # ── Enrichment synthesis (Bedrock: raw data → structured Enrichment) ──────
  EnrichmentSynthesisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: enrichment-synthesis.handler
      MemorySize: 512
      Timeout: 60
      Policies:
        - AmazonBedrockFullAccess
      Events:
        EnrichSynthPost:
          Type: HttpApi
          Properties:
            Path: /enrichment-synthesis
            Method: POST
        EnrichSynthOptions:
          Type: HttpApi
          Properties:
            Path: /enrichment-synthesis
            Method: OPTIONS

  # ── Enrich (orchestrator: calls ch-lookup + web-enrichment + synthesis) ───
  # This is what the frontend calls. Invokes the three functions above in sequence.
  EnrichFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: enrich.handler
      MemorySize: 256
      Timeout: 90
      Policies:
        - AmazonBedrockFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: '*'
      Environment:
        Variables:
          COMPANIES_HOUSE_API_KEY: !Sub '{{resolve:ssm:/outreach/companies_house_api_key}}'
          BRAVE_API_KEY: !Sub '{{resolve:ssm:/outreach/brave_api_key}}'
      Events:
        EnrichPost:
          Type: HttpApi
          Properties:
            Path: /enrich
            Method: POST
        EnrichOptions:
          Type: HttpApi
          Properties:
            Path: /enrich
            Method: OPTIONS

  # ── Send real outreach email + update CRM ────────────────────────────────
  SendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: send.handler
      MemorySize: 256
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProspectsTable
      Environment:
        Variables:
          RESEND_API_KEY: !Sub '{{resolve:ssm:/outreach/resend_api_key}}'
          OUTREACH_API_KEY: !Sub '{{resolve:ssm:/outreach/api_key}}'
      Events:
        SendPost:
          Type: HttpApi
          Properties:
            Path: /send
            Method: POST
        SendOptions:
          Type: HttpApi
          Properties:
            Path: /send
            Method: OPTIONS

  # ── Portfolio demo: generate + send via Resend ───────────────────────────
  # Requires SSM param: /outreach/resend_api_key
  # Resend sender domain: demo@ishsitotombe.co.uk must be verified in Resend.
  DemoSendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambda/
      Handler: demo-send.handler
      MemorySize: 512
      Timeout: 60
      Policies:
        - AmazonBedrockFullAccess
      Environment:
        Variables:
          RESEND_API_KEY: !Sub '{{resolve:ssm:/outreach/resend_api_key}}'
          ALLOWED_ORIGIN: 'https://ishsitotombe.co.uk'
      Events:
        DemoSendPost:
          Type: HttpApi
          Properties:
            Path: /demo-send
            Method: POST
        DemoSendOptions:
          Type: HttpApi
          Properties:
            Path: /demo-send
            Method: OPTIONS

Outputs:
  OutreachApiUrl:
    Description: 'API Gateway base URL'
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  ProspectsTableName:
    Description: 'DynamoDB table name for prospects CRM'
    Value: !Ref ProspectsTable
